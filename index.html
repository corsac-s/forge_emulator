<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forge Emulator</title>
<link rel="icon" href="ow-forge-icon.ico" type="image/x-icon">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">
    <img src="ollee-forge-logo-dark.png" alt="Ollee Forge" class="title-logo">
    <span>Emulator</span>
  </h1>
  <p class="subtitle">Ollee Watch Forge emulator - load, edit, run and test Ollee Watch Forge watchface scripts.<br>Minification done with <a href="https://github.com/terser/terser">Terser</a></p>

  <div class="layout">
    <div class="face-panel">
      <div class="panel-section">
        <span class="panel-label">output</span>
        <div id="watchface" class="watchface"></div>
        <button id="charset-btn" class="charset-btn" type="button" aria-expanded="false" aria-controls="charset-panel">Character set</button>
        <div id="charset-panel" class="charset-panel" hidden></div>
      </div>

      <div class="panel-section">
        <span class="panel-label">input</span>
        <div class="controls">
          <button id="btn-l" class="phys-btn">L</button>
          <button id="btn-m" class="phys-btn">M</button>
          <button id="btn-a" class="phys-btn">A</button>
          <button id="btn-tilt" class="phys-btn phys-btn-tilt">TILT</button>
          <button id="btn-tap" class="phys-btn phys-btn-tilt">TAP</button>
        </div>
      </div>

      <div class="panel-section">
        <span class="panel-label">phone (BLE)</span>
        <div class="ble-row">
          <input type="text" id="ble-input" placeholder="write to watch (max 20 bytes)" aria-label="Data to write to the watch">
          <button id="ble-send-btn" type="button">Send</button>
        </div>
        <label class="ble-connected"><input type="checkbox" id="ble-connected" checked> phone connected</label>
      </div>
    </div>

    <div class="editor-panel">
      <span class="panel-label">controls</span>
      <div class="filename-row">
        <label for="filename-input">File name</label>
        <input type="text" id="filename-input" placeholder="untitled.js">
      </div>
      <div class="toolbar">
        <input type="file" id="file-input" accept=".js,.txt" hidden>
        <button id="load-file-btn">Load file</button>
        <button id="save-file-btn">Save script</button>
        <button id="minify-btn">Minify</button>
        <button id="save-minified-btn">Save minified script</button>
      </div>
      <div class="toolbar">
        <button id="run-btn">Run</button>
        <button id="run-minified-btn">Run minified</button>
        <button id="stop-btn">Stop</button>
        <span id="status" class="status"></span>
      </div>
      <hr class="panel-divider">
      <span class="panel-label">source</span>
      <div class="editor-tabs">
        <button class="tab-btn active" id="tab-original" type="button"></button>
        <button class="tab-btn" id="tab-minified" type="button"></button>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <textarea id="editor-minified" spellcheck="false" hidden></textarea>
      <div class="toolbar">
        <button id="copy-source-btn" class="icon-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/>
            <path d="M10.5 5.5V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v7A1.5 1.5 0 0 0 4 11.5h1.5"/>
          </svg>
          <span>Copy source</span>
        </button>
      </div>
      <span class="panel-label">log</span>
      <div id="log" class="log"></div>
      <div class="toolbar">
        <button id="copy-log-btn" class="icon-btn" type="button">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="5.5" y="5.5" width="8" height="9" rx="1.5"/>
            <path d="M10.5 5.5V3a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 3v7A1.5 1.5 0 0 0 4 11.5h1.5"/>
          </svg>
          <span>Copy log</span>
        </button>
      </div>
    </div>
  </div>

  <script src="js/lcdChars.js"></script>
  <script src="js/charSetView.js"></script>
  <script src="js/watchface.js"></script>
  <script src="js/ollee.js"></script>
  <script src="js/vendor/terser.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
